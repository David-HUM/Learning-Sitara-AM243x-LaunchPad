# Consola UART de la placa, sin shell.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_MULTITHREADING=y
CONFIG_SHELL=n

# Prueba de arranque con MPU y diagnóstico visible por UART.
CONFIG_ARM_MPU=y
CONFIG_BOOT_BANNER=y
CONFIG_EARLY_CONSOLE=y
CONFIG_ASSERT=y
CONFIG_FAULT_DUMP=2
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
# Mantener printk directo, independiente del backend de logging.
CONFIG_LOG_PRINTK=n
CONFIG_LOG_DEFAULT_LEVEL=4

# Marcadores directos antes del kernel; desactivar con n para quitarlos.
CONFIG_HOLA_EARLY_UART_TRACE=y
